[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prismrunner"
version = "0.1.0"
description = "Lightweight, local-first LLM batch inference engine for structured datasets and Pydantic schemas"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "pydantic>=2.6.0",
    "pyarrow>=14.0.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
prismrunner = "prismrunner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["prismrunner*"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
