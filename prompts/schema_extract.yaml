version: "1.0"
task: schema_extract

instruction: "Extract all factual instances of {schema_name} from the following text."

variables:
  guidelines: "Extract exact, verbatim factual evidence without hallucinating or assuming values not present in the text. Output valid JSON array only."

prompt: |
  {instruction}
  Scope: {schema_description}

  Guidelines:
  {guidelines}

  Source Content:
  """
  {{ text }}
  """

  {schema_block}
